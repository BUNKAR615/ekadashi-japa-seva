<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ekadashi Japa Seva · Hare Krishna Marwad Mandir</title>
<meta name="theme-color" content="#F7F5F1">
<meta name="description" content="Record your chanting rounds on Ekadashi and see what the temple community offers together — Hare Krishna Marwad Mandir.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japa Seva">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<!-- ?v= is bumped on every release so phones never run a stale cached copy -->
<link rel="stylesheet" href="styles.css?v=19">
</head>
<body>
<div id="frame">

  <!-- ===== Welcome (2a) ===== -->
  <section id="welcome" class="screen">
    <div class="welcome-inner">
      <img class="welcome-logo" src="assets/hkm-marwar-logo.png" alt="Hare Krishna Marwad Mandir">
      <div class="welcome-portrait">
        <img src="assets/prabhupada-circle.png" alt="Srila Prabhupada">
      </div>
      <h1 class="welcome-title">Ekadashi Japa Seva</h1>

      <!-- One card, six states: sign in, create account, forgot password,
           recover an address that already has an account, "check your
           email", and choosing a new password after following the link.
           app.js shows the fields each state needs. Nothing here is
           marked required, because a hidden required field would block
           the form; every state validates its own fields in script. -->
      <form id="auth-form" class="auth-card" autocomplete="on">
        <h2 class="auth-heading" id="auth-heading">Welcome back</h2>
        <p class="auth-sub" id="auth-sub">Sign in with your email and password.</p>

        <p class="auth-note hidden" id="auth-note"></p>

        <div id="auth-name-block" class="hidden">
          <label class="field-label" for="auth-name">Full name</label>
          <input class="field" id="auth-name" type="text" name="name"
                 autocomplete="name" placeholder="Your name">
        </div>

        <div id="auth-email-block">
          <label class="field-label" for="auth-email">Email</label>
          <input class="field" id="auth-email" type="email" name="email"
                 autocomplete="email" inputmode="email" autocapitalize="none"
                 autocorrect="off" spellcheck="false" placeholder="dinesh@example.com">
        </div>

        <div id="auth-pass-block">
          <label class="field-label" for="auth-pass" id="auth-pass-label">Password</label>
          <input class="field" id="auth-pass" type="password" name="password"
                 autocomplete="current-password" placeholder="••••••••">
        </div>

        <div id="auth-pass2-block" class="hidden">
          <label class="field-label" for="auth-pass2">Confirm new password</label>
          <input class="field" id="auth-pass2" type="password"
                 autocomplete="new-password" placeholder="••••••••">
        </div>

        <p id="auth-error" class="auth-error hidden"></p>
        <button type="submit" class="btn-primary" id="auth-submit">Sign In</button>
        <p class="auth-switch" id="auth-switch"></p>
      </form>

      <p class="welcome-footer">Chant Hare Krishna and Be Happy</p>
    </div>
  </section>

  <!-- ===== App shell (2b) ===== -->
  <div id="app" class="screen hidden">
    <header id="appbar">
      <img class="brand-logo" src="assets/hkm-marwar-logo.png" alt="Hare Krishna Marwad Mandir">
      <span class="role-badge hidden" id="role-badge">Admin</span>
    </header>
    <main id="content"></main>
    <nav id="tabbar"></nav>
  </div>

  <!-- ===== Overlays ===== -->
  <div id="overlay-root"></div>

  <div id="loading" class="loading-overlay hidden">
    <div class="loading-card">
      <div class="pulse-ring"><span></span></div>
      <p>Preparing your dashboard…</p>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js?v=19"></script>
<script src="store.js?v=19"></script>
<script src="app.js?v=19"></script>
</body>
</html>
