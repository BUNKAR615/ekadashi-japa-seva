<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ekadashi Japa Seva · Hare Krishna Marwad Mandir</title>
<meta name="theme-color" content="#4A1B1F">
<meta name="description" content="Record your Ekadashi japa rounds and see the group's offering — Hare Krishna Marwad Mandir.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japa Seva">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Jost:wght@300;400;500;600&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="frame">

  <!-- ===== Welcome (direction 1a — Arch & jali) ===== -->
  <section id="welcome" class="screen">
    <div class="jali-band"></div>
    <div class="welcome-inner">
      <div class="welcome-brand">
        <img src="assets/hkm-marwar-logo.jpg" alt="Hare Krishna Marwad Mandir" width="46" height="39">
        <div class="brand-eyebrow">Hare Krishna</div>
        <div class="brand-name">Marwad Mandir</div>
      </div>
      <div class="arch-photo">
        <img src="assets/prabhupada.jpg" alt="Śrīla Prabhupāda">
      </div>
      <div class="gold-divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
      <p class="welcome-quote">“Chant Hare Krishna and be happy.”</p>
      <div class="quote-attrib">Śrīla Prabhupāda</div>

      <form id="auth-form" class="auth-card" autocomplete="off">
        <h2 id="auth-title">Hare Krishna 🙏</h2>
        <p id="auth-sub" class="auth-sub">Welcome to Hare Krishna Marwad Mandir</p>
        <div id="auth-name-block" class="field-block hidden">
          <label class="field-label" for="auth-name">Full name</label>
          <input class="field" id="auth-name" type="text" placeholder="Your name">
        </div>
        <label class="field-label" for="auth-email">Email</label>
        <input class="field" id="auth-email" type="email" placeholder="dinesh@example.com" required>
        <label class="field-label" for="auth-pass">Password</label>
        <input class="field" id="auth-pass" type="password" placeholder="••••••••" required>
        <p id="auth-error" class="auth-error hidden"></p>
        <button type="submit" class="btn-primary" id="auth-submit">Sign In</button>
        <p class="auth-switch" id="auth-switch">Don’t have an account? <a href="#" id="auth-toggle">Create Account</a></p>
      </form>

      <p class="welcome-footer">Chant • Remember • Serve</p>
    </div>
  </section>

  <!-- ===== App shell (1d) ===== -->
  <div id="app" class="screen hidden">
    <header id="appbar">
      <div class="appbar-brand">
        <img src="assets/hkm-marwar-logo.jpg" alt="" width="30" height="25">
        <div>
          <div class="brand-eyebrow sm">Hare Krishna</div>
          <div class="brand-name sm">Marwad Mandir</div>
        </div>
      </div>
      <div class="role-toggle" id="role-toggle">
        <button type="button" data-role="devotee">Devotee</button>
        <button type="button" data-role="admin">Admin</button>
      </div>
    </header>
    <main id="content"></main>
    <nav id="tabbar"></nav>
  </div>

  <!-- ===== Overlays: sheets, toast, loading ===== -->
  <div id="overlay-root"></div>

  <div id="loading" class="loading-overlay hidden">
    <div class="loading-card">
      <div class="pulse-ring"><span></span></div>
      <p>Preparing your Japa dashboard…</p>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
