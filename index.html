<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ekadashi Japa Seva · Hare Krishna Mandir, Jodhpur</title>
<meta name="theme-color" content="#F7F5F1">
<meta name="description" content="Record your chanting rounds on Ekadashi and see what the temple community offers together — Hare Krishna Mandir, Jodhpur.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japa Seva">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<!-- ?v= is bumped on every release so phones never run a stale cached copy -->
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
<div id="frame">

  <!-- ===== Welcome (2a) ===== -->
  <section id="welcome" class="screen">
    <div class="welcome-inner">
      <img class="welcome-logo" src="assets/hkm-jodhpur-logo.png" alt="Hare Krishna Mandir, Jodhpur">
      <div class="welcome-portrait">
        <img src="assets/prabhupada-circle.png" alt="Srila Prabhupada">
      </div>
      <h1 class="welcome-title">Ekadashi Japa Seva</h1>
      <p class="welcome-sub">Record your chanting rounds on Ekadashi and see what the temple community offers together.</p>

      <form id="auth-form" class="auth-card" autocomplete="off">
        <div id="auth-name-block" class="hidden">
          <label class="field-label" for="auth-name">Full name</label>
          <input class="field" id="auth-name" type="text" placeholder="Your name">
        </div>
        <label class="field-label" for="auth-email">Email</label>
        <input class="field" id="auth-email" type="email" placeholder="dinesh@example.com" required>
        <label class="field-label" for="auth-pass">Password</label>
        <input class="field" id="auth-pass" type="password" placeholder="••••••••" required>
        <p id="auth-error" class="auth-error hidden"></p>
        <button type="submit" class="btn-primary" id="auth-submit">Sign In</button>
        <p class="auth-switch" id="auth-switch">New here? <a href="#" id="auth-toggle">Create Account</a></p>
      </form>

      <p class="welcome-footer">Chant Hare Krishna and Be Happy</p>
    </div>
  </section>

  <!-- ===== App shell (2b) ===== -->
  <div id="app" class="screen hidden">
    <header id="appbar">
      <img class="brand-logo" src="assets/hkm-jodhpur-logo.png" alt="Hare Krishna Mandir, Jodhpur">
      <div class="role-toggle hidden" id="role-toggle">
        <button type="button" data-role="devotee">Devotee</button>
        <button type="button" data-role="admin">Admin</button>
      </div>
    </header>
    <main id="content"></main>
    <nav id="tabbar"></nav>
  </div>

  <!-- ===== Overlays ===== -->
  <div id="overlay-root"></div>

  <div id="loading" class="loading-overlay hidden">
    <div class="loading-card">
      <div class="pulse-ring"><span></span></div>
      <p>Preparing your dashboard…</p>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js?v=5"></script>
<script src="store.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
